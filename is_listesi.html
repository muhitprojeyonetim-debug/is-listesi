<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İş Listesi</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1117;
    --surface: #181c27;
    --surface2: #1f2436;
    --border: #2a3045;
    --accent: #3b82f6;
    --accent2: #1d4ed8;
    --text: #e8eaf0;
    --text2: #8892aa;
    --text3: #4a5368;
    --red: #ef4444;
    --orange: #f97316;
    --yellow: #eab308;
    --green: #22c55e;
    --blue: #3b82f6;
    --purple: #a855f7;
    --teal: #14b8a6;
    --radius: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    font-size: 14px;
  }

  /* ── HEADER ── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 56px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 2px;
    color: var(--text);
  }

  .logo span { color: var(--accent); }

  .header-actions { display: flex; gap: 10px; align-items: center; }

  /* ── BUTTONS ── */
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 14px; border-radius: 7px; font-size: 13px;
    font-family: 'DM Sans', sans-serif; font-weight: 500;
    cursor: pointer; border: none; transition: all .15s;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent2); }
  .btn-ghost { background: transparent; color: var(--text2); border: 1px solid var(--border); }
  .btn-ghost:hover { background: var(--surface2); color: var(--text); }
  .btn-sm { padding: 4px 10px; font-size: 12px; border-radius: 5px; }
  .btn-danger { background: #450a0a; color: var(--red); border: 1px solid #7f1d1d; }
  .btn-danger:hover { background: #7f1d1d; }

  /* ── LAYOUT ── */
  .app { display: flex; height: calc(100vh - 56px); overflow: hidden; }

  /* ── SIDEBAR ── */
  .sidebar {
    width: 260px; min-width: 260px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    overflow: hidden;
  }

  .sidebar-header {
    padding: 16px;
    border-bottom: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 10px;
  }

  .sidebar-title {
    font-size: 11px; font-weight: 600; letter-spacing: .08em;
    text-transform: uppercase; color: var(--text3);
  }

  .search-box {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 7px 10px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px; width: 100%;
    outline: none;
  }
  .search-box:focus { border-color: var(--accent); }
  .search-box::placeholder { color: var(--text3); }

  .sidebar-list {
    flex: 1; overflow-y: auto; padding: 8px;
  }
  .sidebar-list::-webkit-scrollbar { width: 4px; }
  .sidebar-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .sidebar-item {
    padding: 9px 12px; border-radius: 7px; cursor: pointer;
    margin-bottom: 2px; transition: all .12s;
    border: 1px solid transparent;
    display: flex; align-items: center; justify-content: space-between;
  }
  .sidebar-item:hover { background: var(--surface2); }
  .sidebar-item.active {
    background: #1e3a5f; border-color: #2563eb40;
    color: #93c5fd;
  }

  .sidebar-item-name {
    font-size: 13px; font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    flex: 1;
  }

  .badge {
    font-size: 10px; font-weight: 600; border-radius: 20px;
    padding: 1px 6px; min-width: 18px; text-align: center;
    flex-shrink: 0; margin-left: 6px;
  }
  .badge-red { background: #450a0a; color: var(--red); }
  .badge-blue { background: #1e3a5f; color: #93c5fd; }
  .badge-gray { background: var(--surface2); color: var(--text3); }

  /* ── ANA PANEL ── */
  .main {
    flex: 1; overflow-y: auto; display: flex; flex-direction: column;
  }
  .main::-webkit-scrollbar { width: 5px; }
  .main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  /* ── ANA SAYFA ── */
  .ana-sayfa { padding: 24px; }

  .ana-sayfa-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 20px;
  }

  .ana-sayfa-baslik {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px; letter-spacing: 1px; color: var(--text);
  }

  .stats-row {
    display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap;
  }

  .stat-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px 18px;
    display: flex; align-items: center; gap: 12px; flex: 1; min-width: 120px;
  }

  .stat-icon { font-size: 20px; }
  .stat-val { font-size: 22px; font-weight: 600; line-height: 1; }
  .stat-lbl { font-size: 11px; color: var(--text2); margin-top: 2px; }

  /* ── TABLO ── */
  .table-wrap {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden;
  }

  .table-toolbar {
    padding: 12px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }

  .table-title { font-weight: 600; font-size: 14px; }

  table { width: 100%; border-collapse: collapse; }

  th {
    background: var(--bg); padding: 10px 14px; text-align: left;
    font-size: 11px; font-weight: 600; letter-spacing: .06em;
    text-transform: uppercase; color: var(--text3);
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }

  td {
    padding: 11px 14px; border-bottom: 1px solid var(--border);
    vertical-align: top; font-size: 13px;
  }

  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--surface2); }

  .td-ada {
    font-weight: 600; color: #93c5fd; white-space: nowrap;
    cursor: pointer; font-size: 12px;
  }
  .td-ada:hover { text-decoration: underline; }

  .td-not { max-width: 420px; line-height: 1.5; }
  .td-tarih { color: var(--text2); font-size: 12px; white-space: nowrap; }

  /* ── DURUM BADGE ── */
  .durum {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 600;
    white-space: nowrap; cursor: pointer; border: none;
    font-family: 'DM Sans', sans-serif;
  }
  .durum-bekliyor    { background: #1c1917; color: #d6d3d1; border: 1px solid #44403c; }
  .durum-devam       { background: #1e3a5f; color: #93c5fd; border: 1px solid #1d4ed840; }
  .durum-acil        { background: #450a0a; color: #fca5a5; border: 1px solid #7f1d1d40; }
  .durum-bekir       { background: #14532d; color: #86efac; border: 1px solid #15803d40; }
  .durum-belediye    { background: #312e81; color: #c4b5fd; border: 1px solid #4338ca40; }
  .durum-tamamlandi  { background: #052e16; color: #4ade80; border: 1px solid #16a34a40; }
  .durum-iptal       { background: #1c1917; color: #78716c; border: 1px solid #44403c40; }

  /* ── DETAY PANELİ ── */
  .detay-panel { padding: 24px; flex: 1; }

  .detay-header {
    display: flex; align-items: flex-start; justify-content: space-between;
    margin-bottom: 20px; gap: 16px;
  }

  .detay-baslik {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 24px; letter-spacing: 1px; color: var(--text);
    line-height: 1.1;
    display: flex; align-items: center; gap: 8px;
  }

  .detay-baslik-text {
    outline: none; cursor: text;
    border-bottom: 1px solid transparent;
    transition: border-color .15s;
    min-width: 60px;
  }
  .detay-baslik-text:focus { border-bottom-color: var(--accent); }

  .rename-btn {
    font-size: 14px; cursor: pointer; opacity: .4;
    background: none; border: none; color: var(--text);
    padding: 2px 4px; border-radius: 4px; transition: opacity .15s;
  }
  .rename-btn:hover { opacity: 1; background: var(--surface2); }

  /* ── EMOJİ SEÇİCİ ── */
  .emoji-picker {
    display: none; position: fixed; z-index: 500;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px;
    box-shadow: 0 8px 32px rgba(0,0,0,.5);
    width: 280px;
  }
  .emoji-picker.open { display: block; }
  .emoji-picker-title {
    font-size: 11px; font-weight: 600; color: var(--text3);
    letter-spacing: .06em; text-transform: uppercase;
    margin-bottom: 8px;
  }
  .emoji-grid {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px;
  }
  .emoji-btn {
    font-size: 20px; padding: 6px; border-radius: 6px;
    cursor: pointer; border: none; background: transparent;
    text-align: center; transition: background .1s;
    line-height: 1;
  }
  .emoji-btn:hover { background: var(--surface2); }
  .emoji-search {
    width: 100%; background: var(--bg);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 10px; color: var(--text);
    font-family: 'DM Sans', sans-serif; font-size: 13px;
    outline: none; margin-bottom: 8px;
  }
  .emoji-search:focus { border-color: var(--accent); }
  .emoji-close {
    float: right; background: none; border: none;
    color: var(--text3); cursor: pointer; font-size: 16px; padding: 0;
  }

  .detay-toolbar {
    display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end;
  }

  .not-listesi { display: flex; flex-direction: column; gap: 8px; }

  .not-kart {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    display: flex; gap: 14px; align-items: flex-start;
    transition: border-color .15s;
  }
  .not-kart:hover { border-color: #374151; }
  .not-kart.tamamlandi { opacity: .45; }

  .not-kart-meta {
    display: flex; flex-direction: column; gap: 4px; align-items: flex-start;
    min-width: 80px;
  }

  .not-tarih-badge {
    font-size: 11px; font-weight: 600; color: var(--text2);
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 5px; padding: 2px 7px; white-space: nowrap;
  }

  .not-icerik { flex: 1; line-height: 1.6; font-size: 13.5px; }

  .not-actions { display: flex; flex-direction: column; gap: 5px; align-items: flex-end; }

  /* ── MODAL ── */
  .modal-bg {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.7); z-index: 200;
    align-items: center; justify-content: center;
  }
  .modal-bg.open { display: flex; }

  .modal {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 24px; width: 100%; max-width: 520px;
    margin: 16px;
  }

  .modal-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px; letter-spacing: 1px; margin-bottom: 18px; color: var(--text);
  }

  .form-group { margin-bottom: 14px; }
  .form-label {
    display: block; font-size: 12px; font-weight: 600;
    color: var(--text2); margin-bottom: 6px; letter-spacing: .04em;
  }

  .form-input, .form-select, .form-textarea {
    width: 100%; background: var(--bg);
    border: 1px solid var(--border); border-radius: 7px;
    padding: 9px 12px; color: var(--text);
    font-family: 'DM Sans', sans-serif; font-size: 13px;
    outline: none; transition: border-color .15s;
  }
  .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--accent); }
  .form-textarea { resize: vertical; min-height: 80px; }
  .form-select option { background: var(--surface); }

  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }

  /* ── DURUM DROPDOWN ── */
  .durum-menu {
    display: none; position: absolute; z-index: 300;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 9px; padding: 4px;
    box-shadow: 0 8px 24px rgba(0,0,0,.4);
    min-width: 160px;
  }
  .durum-menu.open { display: block; }
  .durum-opt {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; border-radius: 6px; cursor: pointer; font-size: 12px;
    color: var(--text); transition: background .1s;
  }
  .durum-opt:hover { background: var(--surface2); }

  /* ── EMPTY STATE ── */
  .empty {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 60px 24px; color: var(--text3);
    gap: 10px; text-align: center;
  }
  .empty-icon { font-size: 36px; opacity: .4; }
  .empty-text { font-size: 14px; }

  /* ── LOADING ── */
  .loading {
    display: flex; align-items: center; justify-content: center;
    padding: 60px; color: var(--text3); gap: 10px; font-size: 14px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner {
    width: 20px; height: 20px; border: 2px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin .7s linear infinite;
  }

  /* ── TOAST ── */
  .toast {
    position: fixed; bottom: 24px; right: 24px; z-index: 400;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 9px; padding: 12px 18px;
    font-size: 13px; color: var(--text);
    box-shadow: 0 4px 16px rgba(0,0,0,.4);
    transform: translateY(20px); opacity: 0;
    transition: all .25s; pointer-events: none;
  }
  .toast.show { transform: translateY(0); opacity: 1; }

  .view-hidden { display: none !important; }

  .pos-rel { position: relative; }

  /* ── FILTRE BUTONLARI ── */
  .filter-row {
    display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px;
  }
  .filter-btn {
    padding: 4px 11px; border-radius: 20px; font-size: 11px; font-weight: 600;
    cursor: pointer; border: 1px solid var(--border);
    background: transparent; color: var(--text2); font-family: 'DM Sans', sans-serif;
    transition: all .12s;
  }
  .filter-btn:hover, .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* Delete confirm */
  .del-ada-btn { color: var(--red); font-size: 11px; cursor: pointer; background: none; border: none; font-family: 'DM Sans', sans-serif; }
  .del-ada-btn:hover { text-decoration: underline; }
</style>
</head>
<body>

<header>
  <div class="logo">İŞ <span>LİSTESİ</span></div>
  <div class="header-actions">
    <button class="btn btn-ghost btn-sm" onclick="showView('ana')">🏠 Ana Sayfa</button>
    <button class="btn btn-primary btn-sm" onclick="openYeniAdaModal()">+ Yeni Dosya</button>
  </div>
</header>

<div class="app">
  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">Dosyalar</div>
      <input class="search-box" id="sidebarSearch" placeholder="Ara..." oninput="filterSidebar(this.value)">
    </div>
    <div class="sidebar-list" id="sidebarList">
      <div class="loading"><div class="spinner"></div></div>
    </div>
  </div>

  <!-- ANA PANEL -->
  <div class="main">

    <!-- ANA SAYFA -->
    <div class="ana-sayfa" id="viewAna">
      <div class="ana-sayfa-header">
        <div class="ana-sayfa-baslik">AKTİF GÖREVLER</div>
        <button class="btn btn-ghost btn-sm" onclick="loadAll()">↺ Yenile</button>
      </div>

      <div class="stats-row" id="statsRow">
        <div class="stat-card">
          <div class="stat-icon">🚨</div>
          <div><div class="stat-val" id="statAcil">-</div><div class="stat-lbl">Acil</div></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">⏳</div>
          <div><div class="stat-val" id="statBekliyor">-</div><div class="stat-lbl">Bekliyor</div></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">🔄</div>
          <div><div class="stat-val" id="statDevam">-</div><div class="stat-lbl">Devam Ediyor</div></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">📁</div>
          <div><div class="stat-val" id="statDosya">-</div><div class="stat-lbl">Aktif Dosya</div></div>
        </div>
      </div>

      <div class="filter-row" id="anaFilterRow">
        <button class="filter-btn active" onclick="setAnaFilter('hepsi', this)">Hepsi</button>
        <button class="filter-btn" onclick="setAnaFilter('acil', this)">🚨 Acil</button>
        <button class="filter-btn" onclick="setAnaFilter('bekliyor', this)">⏳ Bekliyor</button>
        <button class="filter-btn" onclick="setAnaFilter('devam', this)">🔄 Devam</button>
        <button class="filter-btn" onclick="setAnaFilter('bekir', this)">👷 Bekir</button>
        <button class="filter-btn" onclick="setAnaFilter('belediye', this)">🏛️ Belediye</button>
      </div>

      <div class="table-wrap">
        <div class="table-toolbar">
          <div class="table-title">Tüm Aktif Notlar</div>
        </div>
        <div id="anaTableWrap">
          <div class="loading"><div class="spinner"></div> Yükleniyor...</div>
        </div>
      </div>
    </div>

    <!-- DETAY SAYFA -->
    <div class="detay-panel view-hidden" id="viewDetay">
      <div class="detay-header">
        <div>
          <div style="font-size:11px;color:var(--text3);margin-bottom:4px;cursor:pointer" onclick="showView('ana')">← Ana Sayfa</div>
          <div class="detay-baslik">
            <span class="detay-baslik-text" id="detayBaslik" contenteditable="true" spellcheck="false"
              onblur="renameDosya(this.textContent)"
              onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur();}">—</span>
            <button class="rename-btn" title="Dosya adını değiştir" onclick="document.getElementById('detayBaslik').focus()">✏️</button>
          </div>
        </div>
        <div class="detay-toolbar">
          <button class="btn btn-primary btn-sm" onclick="openNotModal()">+ Not Ekle</button>
          <button class="del-ada-btn" onclick="deleteDosya()">Dosyayı sil</button>
        </div>
      </div>
      <div id="notListesi" class="not-listesi">
        <div class="loading"><div class="spinner"></div></div>
      </div>
    </div>

  </div>
</div>

<!-- MODALs -->
<div class="modal-bg" id="modalYeniAda">
  <div class="modal">
    <div class="modal-title">YENİ DOSYA</div>
    <div class="form-group">
      <label class="form-label">Ada-Parsel / Müşteri Adı</label>
      <input class="form-input" id="inputAdaAdi" placeholder="örn: AYTEN DENİZ 6081-14">
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('modalYeniAda')">İptal</button>
      <button class="btn btn-primary" onclick="createDosya()">Oluştur</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="modalNot">
  <div class="modal">
    <div class="modal-title" id="modalNotBaslik">NOT EKLE</div>
    <div class="form-group">
      <label class="form-label">Not / Yapılacak</label>
      <div style="position:relative;">
        <textarea class="form-textarea" id="inputNot" placeholder="Yapılacak işi yaz..." style="padding-right:40px;"></textarea>
        <button title="Emoji ekle" onclick="toggleEmojiPicker(event)"
          style="position:absolute;right:8px;top:8px;background:none;border:none;font-size:18px;cursor:pointer;opacity:.6;line-height:1;">😊</button>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Durum</label>
      <select class="form-select" id="inputDurum">
        <option value="⏳ Bekliyor">⏳ Bekliyor</option>
        <option value="🔄 Devam Ediyor">🔄 Devam Ediyor</option>
        <option value="🚨 Acil">🚨 Acil</option>
        <option value="👷 Bekir">👷 Bekir</option>
        <option value="🏛️ Belediye">🏛️ Belediye</option>
        <option value="✅ Tamamlandı">✅ Tamamlandı</option>
        <option value="❌ İptal">❌ İptal</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('modalNot')">İptal</button>
      <button class="btn btn-primary" onclick="saveNot()">Kaydet</button>
    </div>
  </div>
</div>

<!-- EMOJİ SEÇİCİ -->
<div class="emoji-picker" id="emojiPicker">
  <button class="emoji-close" onclick="closeEmojiPicker()">✕</button>
  <div class="emoji-picker-title">Emoji Ekle</div>
  <input class="emoji-search" id="emojiSearch" placeholder="Ara..." oninput="filterEmoji(this.value)">
  <div class="emoji-grid" id="emojiGrid"></div>
</div>

<!-- Durum dropdown (floating) -->
<div class="durum-menu" id="durumMenu">
  <div class="durum-opt" onclick="setDurum('⏳ Bekliyor')">⏳ Bekliyor</div>
  <div class="durum-opt" onclick="setDurum('🔄 Devam Ediyor')">🔄 Devam Ediyor</div>
  <div class="durum-opt" onclick="setDurum('🚨 Acil')">🚨 Acil</div>
  <div class="durum-opt" onclick="setDurum('👷 Bekir')">👷 Bekir</div>
  <div class="durum-opt" onclick="setDurum('🏛️ Belediye')">🏛️ Belediye</div>
  <div class="durum-opt" onclick="setDurum('✅ Tamamlandı')">✅ Tamamlandı</div>
  <div class="durum-opt" onclick="setDurum('❌ İptal')">❌ İptal</div>
</div>

<div class="toast" id="toast"></div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, doc, addDoc, setDoc, updateDoc, deleteDoc, getDocs, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBYmUvJqLkO-UYeBPKLR5J16wHL-7kJKoQ",
  authDomain: "is-listesi-54bce.firebaseapp.com",
  projectId: "is-listesi-54bce",
  storageBucket: "is-listesi-54bce.firebasestorage.app",
  messagingSenderId: "29641591175",
  appId: "1:29641591175:web:b87b59b2189baebe15ab22"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ── STATE ──
let dosyalar = [];       // [{id, ad}]
let aktifDosya = null;   // {id, ad}
let aktifNotId = null;   // durum değiştirirken
let editNotId = null;    // not düzenlerken
let anaFilter = 'hepsi';
let allNotes = [];       // ana sayfa için

// ── HELPERS ──
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function formatTarih(ts) {
  if (!ts) return '—';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleDateString('tr-TR', { day:'2-digit', month:'2-digit', year:'2-digit' });
}

function durumClass(d) {
  if (d === '⏳ Bekliyor')    return 'durum-bekliyor';
  if (d === '🔄 Devam Ediyor') return 'durum-devam';
  if (d === '🚨 Acil')        return 'durum-acil';
  if (d === '👷 Bekir')       return 'durum-bekir';
  if (d === '🏛️ Belediye')   return 'durum-belediye';
  if (d === '✅ Tamamlandı')  return 'durum-tamamlandi';
  if (d === '❌ İptal')       return 'durum-iptal';
  return 'durum-bekliyor';
}

function isTamamlandi(d) {
  return d === '✅ Tamamlandı' || d === '❌ İptal';
}

// ── VIEWS ──
window.showView = function(v) {
  document.getElementById('viewAna').classList.toggle('view-hidden', v !== 'ana');
  document.getElementById('viewDetay').classList.toggle('view-hidden', v !== 'detay');
  if (v === 'ana') {
    aktifDosya = null;
    document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
    loadAll();
  }
};

// ── SIDEBAR ──
window.filterSidebar = function(q) {
  const items = document.querySelectorAll('.sidebar-item');
  items.forEach(el => {
    const ad = el.dataset.ad || '';
    el.style.display = ad.toLowerCase().includes(q.toLowerCase()) ? '' : 'none';
  });
};

function renderSidebar() {
  const list = document.getElementById('sidebarList');
  if (dosyalar.length === 0) {
    list.innerHTML = '<div class="empty"><div class="empty-icon">📂</div><div class="empty-text">Henüz dosya yok</div></div>';
    return;
  }
  list.innerHTML = dosyalar.map(d => `
    <div class="sidebar-item" data-id="${d.id}" data-ad="${d.ad}" onclick="openDosya('${d.id}','${d.ad.replace(/'/g,"\\'")}')">
      <div class="sidebar-item-name">${d.ad}</div>
      <div class="badge badge-blue" id="badge-${d.id}">·</div>
    </div>
  `).join('');
  updateBadges();
}

async function updateBadges() {
  for (const d of dosyalar) {
    const snap = await getDocs(collection(db, 'dosyalar', d.id, 'notlar'));
    const aktif = snap.docs.filter(n => !isTamamlandi(n.data().durum));
    const acil  = aktif.filter(n => n.data().durum === '🚨 Acil');
    const el = document.getElementById('badge-' + d.id);
    if (!el) continue;
    if (acil.length > 0) {
      el.textContent = acil.length;
      el.className = 'badge badge-red';
    } else if (aktif.length > 0) {
      el.textContent = aktif.length;
      el.className = 'badge badge-blue';
    } else {
      el.textContent = '✓';
      el.className = 'badge badge-gray';
    }
  }
}

// ── DOSYA YÜKLEMESİ ──
async function loadDosyalar() {
  const snap = await getDocs(query(collection(db, 'dosyalar'), orderBy('ad')));
  dosyalar = snap.docs.map(d => ({ id: d.id, ad: d.data().ad }));
  renderSidebar();
}

// ── ANA SAYFA ──
window.loadAll = async function() {
  document.getElementById('anaTableWrap').innerHTML = '<div class="loading"><div class="spinner"></div> Yükleniyor...</div>';
  allNotes = [];
  let acilC = 0, bekliyorC = 0, devamC = 0, aktifDosyaC = 0;

  for (const d of dosyalar) {
    const snap = await getDocs(query(collection(db, 'dosyalar', d.id, 'notlar'), orderBy('tarih', 'desc')));
    const notlar = snap.docs.map(n => ({ id: n.id, dosyaId: d.id, dosyaAd: d.ad, ...n.data() }));
    const aktif = notlar.filter(n => !isTamamlandi(n.durum));
    if (aktif.length > 0) aktifDosyaC++;
    aktif.forEach(n => {
      allNotes.push(n);
      if (n.durum === '🚨 Acil') acilC++;
      else if (n.durum === '⏳ Bekliyor') bekliyorC++;
      else if (n.durum === '🔄 Devam Ediyor') devamC++;
    });
  }

  allNotes.sort((a, b) => {
    const ord = { '🚨 Acil': 0, '🔄 Devam Ediyor': 1, '⏳ Bekliyor': 2, '👷 Bekir': 3, '🏛️ Belediye': 4 };
    return (ord[a.durum] ?? 9) - (ord[b.durum] ?? 9);
  });

  document.getElementById('statAcil').textContent = acilC;
  document.getElementById('statBekliyor').textContent = bekliyorC;
  document.getElementById('statDevam').textContent = devamC;
  document.getElementById('statDosya').textContent = aktifDosyaC;

  renderAnaTable();
};

window.setAnaFilter = function(f, btn) {
  anaFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderAnaTable();
};

function renderAnaTable() {
  let filtered = allNotes;
  if (anaFilter !== 'hepsi') {
    const map = { acil:'🚨 Acil', bekliyor:'⏳ Bekliyor', devam:'🔄 Devam Ediyor', bekir:'👷 Bekir', belediye:'🏛️ Belediye' };
    filtered = allNotes.filter(n => n.durum === map[anaFilter]);
  }

  if (filtered.length === 0) {
    document.getElementById('anaTableWrap').innerHTML = '<div class="empty"><div class="empty-icon">✅</div><div class="empty-text">Aktif görev yok</div></div>';
    return;
  }

  document.getElementById('anaTableWrap').innerHTML = `
    <table>
      <thead>
        <tr>
          <th>Dosya</th>
          <th>Tarih</th>
          <th>Not / Yapılacak</th>
          <th>Durum</th>
        </tr>
      </thead>
      <tbody>
        ${filtered.map(n => `
          <tr>
            <td class="td-ada" onclick="openDosya('${n.dosyaId}','${n.dosyaAd.replace(/'/g,"\\'")}')">
              ${n.dosyaAd}
            </td>
            <td class="td-tarih">${formatTarih(n.tarih)}</td>
            <td class="td-not">${n.not}</td>
            <td>
              <div class="pos-rel">
                <button class="durum ${durumClass(n.durum)}" onclick="openDurumMenu(event,'${n.dosyaId}','${n.id}')">
                  ${n.durum || '—'}
                </button>
              </div>
            </td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

// ── DOSYA DETAY ──
window.openDosya = function(id, ad) {
  aktifDosya = { id, ad };
  const baslik = document.getElementById('detayBaslik');
  baslik.textContent = ad;
  document.querySelectorAll('.sidebar-item').forEach(el => {
    el.classList.toggle('active', el.dataset.id === id);
  });
  showView('detay');
  loadNotlar();
};

async function loadNotlar() {
  document.getElementById('notListesi').innerHTML = '<div class="loading"><div class="spinner"></div></div>';
  const snap = await getDocs(query(collection(db, 'dosyalar', aktifDosya.id, 'notlar'), orderBy('tarih', 'desc')));
  const notlar = snap.docs.map(n => ({ id: n.id, ...n.data() }));
  renderNotlar(notlar);
}

function renderNotlar(notlar) {
  if (notlar.length === 0) {
    document.getElementById('notListesi').innerHTML = '<div class="empty"><div class="empty-icon">📝</div><div class="empty-text">Henüz not yok</div></div>';
    return;
  }

  // Aktif önce, tamamlananlar sonda
  const aktif = notlar.filter(n => !isTamamlandi(n.durum));
  const bitti = notlar.filter(n => isTamamlandi(n.durum));
  const sorted = [...aktif, ...bitti];

  document.getElementById('notListesi').innerHTML = sorted.map(n => `
    <div class="not-kart ${isTamamlandi(n.durum) ? 'tamamlandi' : ''}">
      <div class="not-kart-meta">
        <div class="not-tarih-badge">${formatTarih(n.tarih)}</div>
        <div class="pos-rel" style="margin-top:4px">
          <button class="durum ${durumClass(n.durum)}" onclick="openDurumMenu(event,'${aktifDosya.id}','${n.id}')">
            ${n.durum || '—'}
          </button>
        </div>
      </div>
      <div class="not-icerik">${n.not}</div>
      <div class="not-actions">
        <button class="btn btn-ghost btn-sm" onclick="editNot('${n.id}','${n.not.replace(/'/g,"\\'")}','${n.durum}')">✏️</button>
        <button class="btn btn-danger btn-sm" onclick="deleteNot('${n.id}')">🗑</button>
      </div>
    </div>
  `).join('');
}

// ── NOT EKLE / DÜZENLE ──
window.openNotModal = function() {
  editNotId = null;
  document.getElementById('modalNotBaslik').textContent = 'NOT EKLE';
  document.getElementById('inputNot').value = '';
  document.getElementById('inputDurum').value = '⏳ Bekliyor';
  document.getElementById('modalNot').classList.add('open');
  setTimeout(() => document.getElementById('inputNot').focus(), 100);
};

window.editNot = function(id, not, durum) {
  editNotId = id;
  document.getElementById('modalNotBaslik').textContent = 'NOT DÜZENLE';
  document.getElementById('inputNot').value = not;
  document.getElementById('inputDurum').value = durum;
  document.getElementById('modalNot').classList.add('open');
};

window.saveNot = async function() {
  const not = document.getElementById('inputNot').value.trim();
  const durum = document.getElementById('inputDurum').value;
  if (!not) { toast('Not boş olamaz!'); return; }

  if (editNotId) {
    await updateDoc(doc(db, 'dosyalar', aktifDosya.id, 'notlar', editNotId), { not, durum });
    toast('Not güncellendi ✓');
  } else {
    await addDoc(collection(db, 'dosyalar', aktifDosya.id, 'notlar'), {
      not, durum, tarih: new Date()
    });
    toast('Not eklendi ✓');
  }

  closeModal('modalNot');
  loadNotlar();
  updateBadges();
};

window.deleteNot = async function(id) {
  if (!confirm('Bu notu silmek istediğinize emin misiniz?')) return;
  await deleteDoc(doc(db, 'dosyalar', aktifDosya.id, 'notlar', id));
  toast('Not silindi');
  loadNotlar();
  updateBadges();
};

// ── DOSYA ADI DEĞİŞTİR ──
window.renameDosya = async function(yeniAd) {
  yeniAd = yeniAd.trim().toUpperCase();
  if (!yeniAd || !aktifDosya) return;
  if (yeniAd === aktifDosya.ad) return;
  if (dosyalar.find(d => d.ad === yeniAd && d.id !== aktifDosya.id)) {
    toast('Bu isimde bir dosya zaten var!');
    document.getElementById('detayBaslik').textContent = aktifDosya.ad;
    return;
  }
  await updateDoc(doc(db, 'dosyalar', aktifDosya.id), { ad: yeniAd });
  aktifDosya.ad = yeniAd;
  document.getElementById('detayBaslik').textContent = yeniAd;
  toast('Dosya adı güncellendi ✓');
  await loadDosyalar();
};

// ── EMOJİ SEÇİCİ ──
const EMOJILER = [
  '🏛️','🏗️','🏠','🏢','🏬','🏭','🏦','🏨','🏩','🏪',
  '🔧','🔨','⚒️','🛠️','⚙️','🔩','🪛','🪚','🔌','💡',
  '📋','📌','📍','📎','🗂️','📁','📂','🗃️','🗄️','📊',
  '💧','🚰','🔥','⚡','🌊','💨','🌡️','🧱','🪵','🔑',
  '📐','📏','🖊️','✏️','🖌️','🗑️','📦','🚚','🏗️','⛏️',
  '👷','👨‍💼','👩‍💼','🤝','💼','📞','📱','💻','🖨️','📠',
  '🚨','⚠️','❌','✅','⏳','🔄','⏰','📅','🗓️','⏱️',
  '💰','💳','🧾','📈','📉','🏦','💵','🪙','💎','🎯',
  '🌍','🗺️','🧭','📍','🚗','🚛','✈️','🚢','🚧','⛽',
  '🌿','🌳','🌱','☀️','🌧️','❄️','🌪️','🏔️','⛰️','🌋',
  '🔍','🔎','📝','✍️','📣','📢','🔔','🔕','💬','📩',
  '🎉','🎊','🏆','🥇','⭐','🌟','💫','✨','🎯','🎪',
];

let emojiTumu = [...EMOJILER];

function buildEmojiGrid(list) {
  document.getElementById('emojiGrid').innerHTML = list.map(e =>
    `<button class="emoji-btn" onclick="insertEmoji('${e}')">${e}</button>`
  ).join('');
}

window.filterEmoji = function(q) {
  buildEmojiGrid(q ? EMOJILER.filter(e => e.includes(q)) : EMOJILER);
};

window.toggleEmojiPicker = function(e) {
  e.stopPropagation();
  const picker = document.getElementById('emojiPicker');
  if (picker.classList.contains('open')) {
    picker.classList.remove('open');
    return;
  }
  buildEmojiGrid(EMOJILER);
  document.getElementById('emojiSearch').value = '';
  const rect = e.target.getBoundingClientRect();
  picker.style.top = (rect.bottom + 8) + 'px';
  picker.style.left = Math.min(rect.left, window.innerWidth - 290) + 'px';
  picker.classList.add('open');
};

window.closeEmojiPicker = function() {
  document.getElementById('emojiPicker').classList.remove('open');
};

window.insertEmoji = function(emoji) {
  const ta = document.getElementById('inputNot');
  const start = ta.selectionStart;
  const end = ta.selectionEnd;
  ta.value = ta.value.slice(0, start) + emoji + ta.value.slice(end);
  ta.selectionStart = ta.selectionEnd = start + emoji.length;
  ta.focus();
  document.getElementById('emojiPicker').classList.remove('open');
};

document.addEventListener('click', (e) => {
  const picker = document.getElementById('emojiPicker');
  if (picker && !picker.contains(e.target)) picker.classList.remove('open');
});

// ── YENİ DOSYA ──
window.openYeniAdaModal = function() {
  document.getElementById('inputAdaAdi').value = '';
  document.getElementById('modalYeniAda').classList.add('open');
  setTimeout(() => document.getElementById('inputAdaAdi').focus(), 100);
};

window.createDosya = async function() {
  const ad = document.getElementById('inputAdaAdi').value.trim().toUpperCase();
  if (!ad) { toast('Ad boş olamaz!'); return; }
  if (dosyalar.find(d => d.ad === ad)) { toast('Bu dosya zaten var!'); return; }
  const ref = await addDoc(collection(db, 'dosyalar'), { ad, olusturma: new Date() });
  closeModal('modalYeniAda');
  await loadDosyalar();
  toast('Dosya oluşturuldu ✓');
  openDosya(ref.id, ad);
};

window.deleteDosya = async function() {
  if (!aktifDosya) return;
  if (!confirm(`"${aktifDosya.ad}" dosyasını ve tüm notlarını silmek istediğinize emin misiniz?`)) return;
  const snap = await getDocs(collection(db, 'dosyalar', aktifDosya.id, 'notlar'));
  for (const n of snap.docs) await deleteDoc(n.ref);
  await deleteDoc(doc(db, 'dosyalar', aktifDosya.id));
  toast('Dosya silindi');
  await loadDosyalar();
  showView('ana');
};

// ── DURUM MENU ──
let durumTargetDosyaId = null;
let durumTargetNotId = null;

window.openDurumMenu = function(e, dosyaId, notId) {
  e.stopPropagation();
  durumTargetDosyaId = dosyaId;
  durumTargetNotId = notId;
  const menu = document.getElementById('durumMenu');
  menu.style.top = (e.clientY + 4) + 'px';
  menu.style.left = e.clientX + 'px';
  menu.style.position = 'fixed';
  menu.classList.add('open');
};

window.setDurum = async function(durum) {
  document.getElementById('durumMenu').classList.remove('open');
  await updateDoc(doc(db, 'dosyalar', durumTargetDosyaId, 'notlar', durumTargetNotId), { durum });
  toast('Durum güncellendi ✓');
  if (aktifDosya && aktifDosya.id === durumTargetDosyaId) loadNotlar();
  else loadAll();
  updateBadges();
};

document.addEventListener('click', () => document.getElementById('durumMenu').classList.remove('open'));

// ── MODAL ──
window.closeModal = function(id) { document.getElementById(id).classList.remove('open'); };
document.querySelectorAll('.modal-bg').forEach(m => m.addEventListener('click', e => { if (e.target === m) m.classList.remove('open'); }));

// Enter tuşu ile kaydet
document.getElementById('inputAdaAdi').addEventListener('keydown', e => { if (e.key === 'Enter') window.createDosya(); });

// ── BAŞLAT ──
async function init() {
  await loadDosyalar();
  await loadAll();
}

init();
</script>
</body>
