<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İş Listesi</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --surface2: #f0f1f4;
    --border: #dfe1e6;
    --accent: #2563eb;
    --accent2: #1d4ed8;
    --text: #172b4d;
    --text2: #5e6c84;
    --text3: #97a0af;
    --red: #de350b;
    --orange: #ff8b00;
    --yellow: #ffab00;
    --green: #00875a;
    --blue: #2563eb;
    --purple: #8b5cf6;
    --teal: #00b8d9;
    --radius: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    font-size: 14px;
  }

  /* ── HEADER ── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 56px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px; letter-spacing: 2px; color: var(--text);
  }
  .logo span { color: var(--accent); }

  .header-actions { display: flex; gap: 10px; align-items: center; }

  /* ── BUTTONS ── */
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 14px; border-radius: 7px; font-size: 13px;
    font-family: 'DM Sans', sans-serif; font-weight: 500;
    cursor: pointer; border: none; transition: all .15s;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent2); }
  .btn-ghost { background: transparent; color: var(--text2); border: 1px solid var(--border); }
  .btn-ghost:hover { background: var(--surface2); color: var(--text); }
  .btn-sm { padding: 4px 10px; font-size: 12px; border-radius: 5px; }
  .btn-danger { background: #ffebe6; color: var(--red); border: 1px solid #ffbdad; }
  .btn-danger:hover { background: #ffbdad; }

  /* ── LAYOUT ── */
  .app { display: flex; height: calc(100vh - 56px); overflow: hidden; }

  /* ── SIDEBAR ── */
  .sidebar {
    width: 260px; min-width: 260px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .sidebar-header {
    padding: 16px; border-bottom: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 10px;
  }
  .sidebar-title {
    font-size: 11px; font-weight: 600; letter-spacing: .08em;
    text-transform: uppercase; color: var(--text3);
  }
  .search-box {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 7px; padding: 7px 10px; color: var(--text);
    font-family: 'DM Sans', sans-serif; font-size: 13px; width: 100%;
    outline: none;
  }
  .search-box:focus { border-color: var(--accent); }
  .search-box::placeholder { color: var(--text3); }

  .sidebar-list { flex: 1; overflow-y: auto; padding: 8px; }
  .sidebar-list::-webkit-scrollbar { width: 4px; }
  .sidebar-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .sidebar-item {
    padding: 9px 12px; border-radius: 7px; cursor: pointer;
    margin-bottom: 2px; transition: all .12s;
    border: 1px solid transparent;
    display: flex; align-items: center; justify-content: space-between;
  }
  .sidebar-item:hover { background: var(--surface2); }
  .sidebar-item.active { background: #e9f2ff; border-color: #b3d4ff; color: #0052cc; }

  .sidebar-item-name {
    font-size: 13px; font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1;
  }

  .badge {
    font-size: 10px; font-weight: 600; border-radius: 20px;
    padding: 1px 6px; min-width: 18px; text-align: center;
    flex-shrink: 0; margin-left: 6px;
  }
  .badge-red { background: #ffebe6; color: var(--red); }
  .badge-blue { background: #e9f2ff; color: #0052cc; }
  .badge-gray { background: var(--surface2); color: var(--text3); }

  /* ── ANA PANEL ── */
  .main { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
  .main::-webkit-scrollbar { width: 5px; }
  .main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .ana-sayfa { padding: 24px; }
  .ana-sayfa-header {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px;
  }
  .ana-sayfa-baslik {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px; letter-spacing: 1px; color: var(--text);
  }

  .stats-row {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 10px; margin-bottom: 24px;
  }
  .stat-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 12px 14px;
    display: flex; align-items: center; gap: 10px;
    cursor: pointer; transition: all .15s;
  }
  .stat-card:hover { border-color: var(--accent); transform: translateY(-1px); }
  .stat-card.active { border-color: var(--accent); background: #e9f2ff; }
  .stat-icon { font-size: 18px; }
  .stat-val { font-size: 20px; font-weight: 600; line-height: 1; }
  .stat-lbl { font-size: 11px; color: var(--text2); margin-top: 2px; }

  /* ── TABLO ── */
  .table-wrap {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden;
  }
  .table-toolbar {
    padding: 12px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .table-title { font-weight: 600; font-size: 14px; }

  table { width: 100%; border-collapse: collapse; }
  th {
    background: var(--bg); padding: 10px 14px; text-align: left;
    font-size: 11px; font-weight: 600; letter-spacing: .06em;
    text-transform: uppercase; color: var(--text3);
    border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  td {
    padding: 11px 14px; border-bottom: 1px solid var(--border);
    vertical-align: top; font-size: 13px;
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--surface2); }

  .td-ada {
    font-weight: 600; color: #0052cc; white-space: nowrap;
    cursor: pointer; font-size: 12px;
  }
  .td-ada:hover { text-decoration: underline; }
  .td-not { max-width: 420px; line-height: 1.5; }
  .td-tarih { color: var(--text2); font-size: 12px; white-space: nowrap; }

  /* ── DURUM BADGE ── */
  .durum {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 600;
    white-space: nowrap; cursor: pointer; border: 1px solid;
    font-family: 'DM Sans', sans-serif;
  }

  /* ── DETAY PANELİ ── */
  .detay-panel { padding: 24px; flex: 1; }
  .detay-header {
    display: flex; align-items: flex-start; justify-content: space-between;
    margin-bottom: 20px; gap: 16px;
  }
  .detay-baslik {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 24px; letter-spacing: 1px; color: var(--text);
    line-height: 1.1; display: flex; align-items: center; gap: 8px;
  }
  .detay-baslik-text {
    outline: none; cursor: text;
    border-bottom: 1px solid transparent; transition: border-color .15s;
    min-width: 60px;
  }
  .detay-baslik-text:focus { border-bottom-color: var(--accent); }
  .rename-btn {
    font-size: 14px; cursor: pointer; opacity: .4;
    background: none; border: none; color: var(--text);
    padding: 2px 4px; border-radius: 4px; transition: opacity .15s;
  }
  .rename-btn:hover { opacity: 1; background: var(--surface2); }

  .detay-toolbar { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

  .not-listesi { display: flex; flex-direction: column; gap: 8px; }
  .not-kart {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px 16px;
    display: flex; gap: 14px; align-items: flex-start; transition: border-color .15s;
  }
  .not-kart:hover { border-color: #c1c7d0; }
  .not-kart.tamamlandi { opacity: .5; }
  .not-kart-meta {
    display: flex; flex-direction: column; gap: 4px; align-items: flex-start; min-width: 80px;
  }
  .not-tarih-badge {
    font-size: 11px; font-weight: 600; color: var(--text2);
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 5px; padding: 2px 7px; white-space: nowrap;
  }
  .not-icerik { flex: 1; line-height: 1.6; font-size: 13.5px; }
  .not-actions { display: flex; flex-direction: column; gap: 5px; align-items: flex-end; }

  /* ── MODAL ── */
  .modal-bg {
    display: none; position: fixed; inset: 0;
    background: rgba(9,30,66,.54); z-index: 200;
    align-items: center; justify-content: center;
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 24px; width: 100%; max-width: 520px; margin: 16px;
    box-shadow: 0 8px 32px rgba(9,30,66,.25);
  }
  .modal-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px; letter-spacing: 1px; margin-bottom: 18px; color: var(--text);
  }
  .form-group { margin-bottom: 14px; }
  .form-label {
    display: block; font-size: 12px; font-weight: 600;
    color: var(--text2); margin-bottom: 6px; letter-spacing: .04em;
  }
  .form-input, .form-select, .form-textarea {
    width: 100%; background: var(--surface);
    border: 1px solid var(--border); border-radius: 7px;
    padding: 9px 12px; color: var(--text);
    font-family: 'DM Sans', sans-serif; font-size: 13px;
    outline: none; transition: border-color .15s;
  }
  .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--accent); }
  .form-textarea { resize: vertical; min-height: 80px; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }

  /* ── DURUM DROPDOWN ── */
  .durum-menu {
    display: none; position: fixed; z-index: 300;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 9px; padding: 4px;
    box-shadow: 0 8px 24px rgba(9,30,66,.25);
    min-width: 180px; max-height: 340px; overflow-y: auto;
  }
  .durum-menu.open { display: block; }
  .durum-opt {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 8px 10px; border-radius: 6px; cursor: pointer; font-size: 12px;
    color: var(--text); transition: background .1s;
  }
  .durum-opt:hover { background: var(--surface2); }
  .durum-opt-del {
    opacity: .4; font-size: 14px; color: var(--red);
    background: none; border: none; cursor: pointer; padding: 2px 5px; border-radius: 4px;
  }
  .durum-opt:hover .durum-opt-del { opacity: .8; }
  .durum-opt-del:hover { opacity: 1 !important; background: #ffebe6; }
  .durum-menu-divider { height: 1px; background: var(--border); margin: 4px 0; }
  .durum-menu-add {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 10px; border-radius: 6px; cursor: pointer; font-size: 12px;
    color: var(--accent); font-weight: 600; transition: background .1s;
  }
  .durum-menu-add:hover { background: var(--surface2); }

  /* ── EMOJİ SEÇİCİ ── */
  .emoji-picker {
    display: none; position: fixed; z-index: 500;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px;
    box-shadow: 0 8px 32px rgba(9,30,66,.25); width: 290px;
  }
  .emoji-picker.open { display: block; }
  .emoji-picker-title {
    font-size: 11px; font-weight: 600; color: var(--text3);
    letter-spacing: .06em; text-transform: uppercase; margin-bottom: 8px;
  }
  .emoji-grid {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px;
    max-height: 220px; overflow-y: auto;
  }
  .emoji-btn {
    font-size: 20px; padding: 6px; border-radius: 6px;
    cursor: pointer; border: none; background: transparent;
    text-align: center; transition: background .1s; line-height: 1;
  }
  .emoji-btn:hover { background: var(--surface2); }
  .emoji-btn.selected { background: #e9f2ff; outline: 2px solid var(--accent); }
  .emoji-search {
    width: 100%; background: var(--bg);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 10px; color: var(--text);
    font-family: 'DM Sans', sans-serif; font-size: 13px;
    outline: none; margin-bottom: 8px;
  }
  .emoji-close {
    float: right; background: none; border: none;
    color: var(--text3); cursor: pointer; font-size: 16px; padding: 0;
  }

  /* Renk seçici */
  .renk-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .renk-btn {
    width: 30px; height: 30px; border-radius: 8px; cursor: pointer;
    border: 2px solid transparent; transition: all .1s;
  }
  .renk-btn.selected { border-color: var(--text); transform: scale(1.1); }

  /* ── EMPTY / LOADING ── */
  .empty {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 60px 24px; color: var(--text3);
    gap: 10px; text-align: center;
  }
  .empty-icon { font-size: 36px; opacity: .5; }
  .empty-text { font-size: 14px; }
  .loading {
    display: flex; align-items: center; justify-content: center;
    padding: 60px; color: var(--text3); gap: 10px; font-size: 14px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner {
    width: 20px; height: 20px; border: 2px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin .7s linear infinite;
  }

  /* ── TOAST ── */
  .toast {
    position: fixed; bottom: 24px; right: 24px; z-index: 400;
    background: var(--text); border-radius: 9px; padding: 12px 18px;
    font-size: 13px; color: #fff;
    box-shadow: 0 4px 16px rgba(9,30,66,.3);
    transform: translateY(20px); opacity: 0;
    transition: all .25s; pointer-events: none;
  }
  .toast.show { transform: translateY(0); opacity: 1; }

  .view-hidden { display: none !important; }
  .pos-rel { position: relative; }

  .del-ada-btn {
    color: var(--red); font-size: 11px; cursor: pointer;
    background: none; border: none; font-family: 'DM Sans', sans-serif;
  }
  .del-ada-btn:hover { text-decoration: underline; }

  @media (max-width: 768px) {
    .sidebar { display: none; }
    .stats-row { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<header>
  <div class="logo">İŞ <span>LİSTESİ</span></div>
  <div class="header-actions">
    <button class="btn btn-ghost btn-sm" onclick="showView('ana')">🏠 Ana Sayfa</button>
    <button class="btn btn-primary btn-sm" onclick="openYeniAdaModal()">+ Yeni Dosya</button>
  </div>
</header>

<div class="app">
  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">Dosyalar</div>
      <input class="search-box" id="sidebarSearch" placeholder="Ara..." oninput="filterSidebar(this.value)">
    </div>
    <div class="sidebar-list" id="sidebarList">
      <div class="loading"><div class="spinner"></div></div>
    </div>
  </div>

  <!-- ANA PANEL -->
  <div class="main">

    <!-- ANA SAYFA -->
    <div class="ana-sayfa" id="viewAna">
      <div class="ana-sayfa-header">
        <div class="ana-sayfa-baslik">AKTİF GÖREVLER</div>
        <button class="btn btn-ghost btn-sm" onclick="loadAll()">↺ Yenile</button>
      </div>

      <div class="stats-row" id="statsRow"></div>

      <div class="table-wrap">
        <div class="table-toolbar">
          <div class="table-title" id="tabloBaslik">Tüm Aktif Notlar</div>
          <div style="display:flex;gap:8px;align-items:center;">
            <input class="search-box" id="notSearch" placeholder="Not veya dosya ara..." style="width:200px;" oninput="renderAnaTable()">
            <select class="form-select" id="siralamaSec" style="width:150px;padding:7px 10px;" onchange="renderAnaTable()">
              <option value="alfabetik">A-Z Alfabetik</option>
              <option value="tarih">Tarihe göre</option>
            </select>
            <button class="btn btn-ghost btn-sm" onclick="openFiltrelePanel()">🔽 Filtrele</button>
            <button class="btn btn-ghost btn-sm" onclick="setAnaFilter('hepsi')">Temizle</button>
          </div>
        </div>
        <div id="anaTableWrap">
          <div class="loading"><div class="spinner"></div> Yükleniyor...</div>
        </div>
      </div>
    </div>

    <!-- DETAY SAYFA -->
    <div class="detay-panel view-hidden" id="viewDetay">
      <div class="detay-header">
        <div>
          <div style="font-size:11px;color:var(--text3);margin-bottom:4px;cursor:pointer" onclick="showView('ana')">← Ana Sayfa</div>
          <div class="detay-baslik">
            <span class="detay-baslik-text" id="detayBaslik" contenteditable="true" spellcheck="false"
              onblur="renameDosya(this.textContent)"
              onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur();}">—</span>
            <button class="rename-btn" title="Dosya adını değiştir" onclick="document.getElementById('detayBaslik').focus()">✏️</button>
          </div>
        </div>
        <div class="detay-toolbar">
          <button class="btn btn-primary btn-sm" onclick="openNotModal()">+ Not Ekle</button>
          <button class="del-ada-btn" onclick="deleteDosya()">Dosyayı sil</button>
        </div>
      </div>
      <div id="notListesi" class="not-listesi">
        <div class="loading"><div class="spinner"></div></div>
      </div>
    </div>

  </div>
</div>

<!-- MODAL: YENİ DOSYA -->
<div class="modal-bg" id="modalYeniAda">
  <div class="modal">
    <div class="modal-title">YENİ DOSYA</div>
    <div class="form-group">
      <label class="form-label">Ada-Parsel / Müşteri Adı</label>
      <input class="form-input" id="inputAdaAdi" placeholder="örn: AYTEN DENİZ 6081-14">
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('modalYeniAda')">İptal</button>
      <button class="btn btn-primary" onclick="createDosya()">Oluştur</button>
    </div>
  </div>
</div>

<!-- MODAL: NOT -->
<div class="modal-bg" id="modalNot">
  <div class="modal">
    <div class="modal-title" id="modalNotBaslik">NOT EKLE</div>
    <div class="form-group">
      <label class="form-label">Not / Yapılacak</label>
      <textarea class="form-textarea" id="inputNot" placeholder="Yapılacak işi yaz..."></textarea>
    </div>
    <div class="form-group">
      <label class="form-label">Durum</label>
      <select class="form-select" id="inputDurum"></select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('modalNot')">İptal</button>
      <button class="btn btn-primary" onclick="saveNot()">Kaydet</button>
    </div>
  </div>
</div>

<!-- MODAL: YENİ DURUM -->
<div class="modal-bg" id="modalYeniDurum">
  <div class="modal" style="max-width:420px;">
    <div class="modal-title">YENİ DURUM EKLE</div>
    <div class="form-group">
      <label class="form-label">Seçenek Adı</label>
      <input class="form-input" id="inputDurumAdi" placeholder="örn: Tesisat Çizimi">
    </div>
    <div class="form-group">
      <label class="form-label">Simge / Emoji</label>
      <div style="display:flex;align-items:center;gap:10px;">
        <button id="secilenEmojiBtn" onclick="openEmojiPickerForDurum(event)"
          style="font-size:26px;background:var(--bg);border:1px solid var(--border);border-radius:8px;width:48px;height:48px;cursor:pointer;">📌</button>
        <span style="font-size:12px;color:var(--text2);">Değiştirmek için tıkla</span>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Renk</label>
      <div class="renk-row" id="renkRow"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('modalYeniDurum')">İptal</button>
      <button class="btn btn-primary" onclick="saveDurum()">Ekle</button>
    </div>
  </div>
</div>

<!-- MODAL: FİLTRELE -->
<div class="modal-bg" id="modalFiltrele">
  <div class="modal" style="max-width:420px;">
    <div class="modal-title">DURUMA GÖRE FİLTRELE</div>
    <div class="form-group" id="filtreListesi" style="display:flex;flex-direction:column;gap:6px;max-height:320px;overflow-y:auto;"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="temizleFiltre()">Temizle</button>
      <button class="btn btn-primary" onclick="uygulaFiltre()">Uygula</button>
    </div>
  </div>
</div>

<!-- DURUM DROPDOWN -->
<div class="durum-menu" id="durumMenu"></div>

<!-- EMOJİ SEÇİCİ -->
<div class="emoji-picker" id="emojiPicker">
  <button class="emoji-close" onclick="closeEmojiPicker()">✕</button>
  <div class="emoji-picker-title">Simge Seç</div>
  <input class="emoji-search" id="emojiSearch" placeholder="Ara..." oninput="filterEmoji(this.value)">

// ── HELPERS ──
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function formatTarih(ts) {
  if (!ts) return '—';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleDateString('tr-TR', { day:'2-digit', month:'2-digit', year:'2-digit' });
}

function durumObj(ad) {
  return durumlar.find(d => d.ad === ad) || { ad, renk: '#5e6c84', bitti: false };
}

function isTamamlandi(ad) {
  const d = durumlar.find(x => x.ad === ad);
  return d ? d.bitti : false;
}

function durumStyle(ad) {
  const d = durumObj(ad);
  return `background:${d.renk}18;color:${d.renk};border-color:${d.renk}44;`;
}

function esc(s) { return String(s||'').replace(/'/g, "\\'").replace(/"/g, '&quot;'); }

// ── DURUM YÖNETİMİ (Firebase) ──
async function loadDurumlar() {
  try {
    const snap = await getDoc(doc(db, 'ayarlar', 'durumlar'));
    if (snap.exists() && Array.isArray(snap.data().liste) && snap.data().liste.length) {
      durumlar = snap.data().liste;
    } else {
      durumlar = [...VARSAYILAN_DURUMLAR];
      await setDoc(doc(db, 'ayarlar', 'durumlar'), { liste: durumlar });
    }
  } catch(e) {
    console.error(e);
    durumlar = [...VARSAYILAN_DURUMLAR];
  }
  buildDurumSelect();
}

async function saveDurumlar() {
  await setDoc(doc(db, 'ayarlar', 'durumlar'), { liste: durumlar });
}

function buildDurumSelect() {
  const sel = document.getElementById('inputDurum');
  sel.innerHTML = durumlar.map(d => `<option value="${d.ad}">${d.ad}</option>`).join('')
    + `<option value="__yeni__" style="font-weight:600;color:#2563eb;">➕ Yeni durum ekle...</option>`;
}

document.getElementById('inputDurum').addEventListener('change', function() {
  if (this.value === '__yeni__') {
    this.value = durumlar[0]?.ad || '';
    openYeniDurumModal();
  }
});

window.openYeniDurumModal = function() {
  document.getElementById('inputDurumAdi').value = '';
  secilenEmoji = '📌';
  secilenRenk = '#2563eb';
  document.getElementById('secilenEmojiBtn').textContent = secilenEmoji;
  buildRenkRow();
  document.getElementById('modalYeniDurum').classList.add('open');
  setTimeout(() => document.getElementById('inputDurumAdi').focus(), 100);
};

function buildRenkRow() {
  document.getElementById('renkRow').innerHTML = RENKLER.map(r =>
    `<div class="renk-btn ${r===secilenRenk?'selected':''}" style="background:${r}" onclick="secRenk('${r}')"></div>`
  ).join('');
}

window.secRenk = function(r) {
  secilenRenk = r;
  buildRenkRow();
};

window.saveDurum = async function() {
  const ad = document.getElementById('inputDurumAdi').value.trim();
  if (!ad) { toast('Seçenek adı boş olamaz!'); return; }
  const tamAd = secilenEmoji + ' ' + ad;
  if (durumlar.find(d => d.ad === tamAd)) { toast('Bu durum zaten var!'); return; }
  durumlar.push({ ad: tamAd, renk: secilenRenk, bitti: false });
  await saveDurumlar();
  buildDurumSelect();
  document.getElementById('inputDurum').value = tamAd;
  closeModal('modalYeniDurum');
  toast('Durum eklendi ✓');
  renderStats();
};

window.deleteDurum = async function(e, ad) {
  e.stopPropagation();
  if (!confirm(`"${ad}" durumunu silmek istediğinize emin misiniz?\n\nBu durumu kullanan notlar silinmez, sadece bu durum kartlardan ve listeden kaldırılır.`)) return;
  durumlar = durumlar.filter(d => d.ad !== ad);
  await saveDurumlar();
  buildDurumSelect();
  buildDurumMenu();
  renderStats();
  toast('Durum silindi');
};

// ── DURUM MENU ──
let durumTargetDosyaId = null;
let durumTargetNotId = null;

function buildDurumMenu() {
  const menu = document.getElementById('durumMenu');
  menu.innerHTML = durumlar.map(d => `
    <div class="durum-opt" onclick="setDurum('${esc(d.ad)}')">
      <span>${d.ad}</span>
      <button class="durum-opt-del" onclick="deleteDurum(event,'${esc(d.ad)}')">✕</button>
    </div>
  `).join('')
  + `<div class="durum-menu-divider"></div>
     <div class="durum-menu-add" onclick="event.stopPropagation();document.getElementById('durumMenu').classList.remove('open');openYeniDurumModal();">
       ➕ Yeni seçenek ekle
     </div>`;
}

window.openDurumMenu = function(e, dosyaId, notId) {
  e.stopPropagation();
  durumTargetDosyaId = dosyaId;
  durumTargetNotId = notId;
  buildDurumMenu();
  const menu = document.getElementById('durumMenu');
  menu.style.top = Math.min(e.clientY + 4, window.innerHeight - 360) + 'px';
  menu.style.left = Math.min(e.clientX, window.innerWidth - 200) + 'px';
  menu.classList.add('open');
};

window.setDurum = async function(durum) {
  document.getElementById('durumMenu').classList.remove('open');
  await updateDoc(doc(db, 'dosyalar', durumTargetDosyaId, 'notlar', durumTargetNotId), { durum });
  toast('Durum güncellendi ✓');
  if (aktifDosya && aktifDosya.id === durumTargetDosyaId) { loadNotlar(); updateBadges(); }
  else loadAll();
};

document.addEventListener('click', (e) => {
  const menu = document.getElementById('durumMenu');
  if (menu && !menu.contains(e.target)) menu.classList.remove('open');
});

// ── EMOJİ SEÇİCİ ──

  '📌','📋','📎','🗂️','📁','📂','🗃️','🗄️','📊','📈','📉','📅','🗓️','⏰',
  '🏛️','🏗️','🏠','🏢','🏬','🏭','🏦','🏨','🏪','🏘️','🏚️','🧱','🪟','🚪',

  '📐','📏','🖊️','✏️','🖌️','🗑️','📦','🚚','🚧','⛽','🛢️','🏷️','📑','📄',
  '👷','👨‍💼','👩‍💼','🤝','💼','📞','📱','💻','🖨️','📠','👤','👥','🧑‍🔧','🧑‍⚖️',
  '🚨','⚠️','❌','✅','⏳','🔄','⏱️','🔔','🔕','❗','❓','💬','📢','📣',
  '💰','💳','🧾','🏦','💵','🪙','💎','🎯','📝','✍️','🖋️','🔍','🔎','🧮',

// ── VIEWS ──
window.showView = function(v) {
  document.getElementById('viewAna').classList.toggle('view-hidden', v !== 'ana');
  document.getElementById('viewDetay').classList.toggle('view-hidden', v !== 'detay');
  if (v === 'ana') {
    aktifDosya = null;
    document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
    loadAll();
  }
};

// ── SIDEBAR ──
window.filterSidebar = function(q) {
  document.querySelectorAll('.sidebar-item').forEach(el => {
    const ad = el.dataset.ad || '';
    el.style.display = ad.toLowerCase().includes(q.toLowerCase()) ? '' : 'none';
  });
};

function renderSidebar() {
  const list = document.getElementById('sidebarList');
  if (dosyalar.length === 0) {
    list.innerHTML = '<div class="empty"><div class="empty-icon">📂</div><div class="empty-text">Henüz dosya yok</div></div>';
    return;
  }
  list.innerHTML = dosyalar.map(d => `
    <div class="sidebar-item" data-id="${d.id}" data-ad="${d.ad}" onclick="openDosya('${d.id}','${esc(d.ad)}')">
      <div class="sidebar-item-name">${d.ad}</div>
      <div class="badge badge-blue" id="badge-${d.id}">·</div>
    </div>
  `).join('');
  updateBadges();
}

async function updateBadges() {
  for (const d of dosyalar) {
    const snap = await getDocs(collection(db, 'dosyalar', d.id, 'notlar'));
    const aktif = snap.docs.filter(n => !isTamamlandi(n.data().durum));
    const acil  = aktif.filter(n => n.data().durum === '🚨 Acil');
    const el = document.getElementById('badge-' + d.id);
    if (!el) continue;
    if (acil.length > 0) { el.textContent = acil.length; el.className = 'badge badge-red'; }
    else if (aktif.length > 0) { el.textContent = aktif.length; el.className = 'badge badge-blue'; }
    else { el.textContent = '✓'; el.className = 'badge badge-gray'; }
  }
}

// ── DOSYA YÜKLEMESİ ──
async function loadDosyalar() {
  const snap = await getDocs(query(collection(db, 'dosyalar'), orderBy('ad')));
  dosyalar = snap.docs.map(d => ({ id: d.id, ad: d.data().ad }));
  renderSidebar();
}

// ── ANA SAYFA ──
const OTO_RENKLER = ['#de350b','#ff8b00','#00875a','#2563eb','#8b5cf6','#00b8d9','#c2185b','#5d4037','#455a64','#f57f17'];
function renkUret(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = str.charCodeAt(i) + ((h << 5) - h);
  return OTO_RENKLER[Math.abs(h) % OTO_RENKLER.length];
}

async function otoDurumKesfet(tumNotlar) {
  const bilinen = new Set(durumlar.map(d => d.ad));
  let yeniEklendi = false;
  tumNotlar.forEach(n => {
    if (n.durum && !bilinen.has(n.durum)) {
      bilinen.add(n.durum);
      const bittiMi = /tamamlan|iptal|bitti|kapat/i.test(n.durum);
      durumlar.push({ ad: n.durum, renk: renkUret(n.durum), bitti: bittiMi });
      yeniEklendi = true;
    }
  });
  if (yeniEklendi) {
    await saveDurumlar();
    buildDurumSelect();
  }
}

window.loadAll = async function() {
  document.getElementById('anaTableWrap').innerHTML = '<div class="loading"><div class="spinner"></div> Yükleniyor...</div>';
  const tumNotlar = [];
  for (const d of dosyalar) {
    const snap = await getDocs(query(collection(db, 'dosyalar', d.id, 'notlar'), orderBy('tarih', 'desc')));
    const notlar = snap.docs.map(n => ({ id: n.id, dosyaId: d.id, dosyaAd: d.ad, ...n.data() }));
    notlar.forEach(n => tumNotlar.push(n));
  }
  await otoDurumKesfet(tumNotlar);
  allNotes = tumNotlar.filter(n => !isTamamlandi(n.durum));
  renderStats();
  renderAnaTable();
};

function renderStats() {
  const sayac = {};
  durumlar.filter(d => !d.bitti).forEach(d => sayac[d.ad] = 0);
  allNotes.forEach(n => { if (sayac[n.durum] !== undefined) sayac[n.durum]++; });
  const aktifDosyaSet = new Set(allNotes.map(n => n.dosyaId));

  let html = durumlar.filter(d => !d.bitti).map(d => {
    const emoji = d.ad.split(' ')[0];
    const isim = d.ad.split(' ').slice(1).join(' ');
    return `
      <div class="stat-card ${anaFilter===d.ad?'active':''}" onclick="setAnaFilter('${esc(d.ad)}')">
        <div class="stat-icon">${emoji}</div>
        <div>
          <div class="stat-val" style="color:${d.renk}">${sayac[d.ad]||0}</div>
          <div class="stat-lbl">${isim}</div>
        </div>
      </div>`;
  }).join('');

  html += `
    <div class="stat-card ${anaFilter==='hepsi'?'active':''}" onclick="setAnaFilter('hepsi')">
      <div class="stat-icon">📁</div>
      <div>
        <div class="stat-val">${aktifDosyaSet.size}</div>
        <div class="stat-lbl">Aktif Dosya</div>
      </div>
    </div>`;

  document.getElementById('statsRow').innerHTML = html;
}

window.setAnaFilter = function(f) {
  anaFilter = f;
  cokluFiltreSet.clear();
  document.getElementById('tabloBaslik').textContent = f === 'hepsi' ? 'Tüm Aktif Notlar' : f;
  renderStats();
  renderAnaTable();
};

window.openFiltrelePanel = function() {
  const el = document.getElementById('filtreListesi');
  el.innerHTML = durumlar.map(d => `
    <label style="display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;cursor:pointer;" onmouseover="this.style.background='var(--surface2)'" onmouseout="this.style.background='transparent'">
      <input type="checkbox" value="${esc(d.ad)}" ${cokluFiltreSet.has(d.ad)?'checked':''} style="width:16px;height:16px;">
      <span>${d.ad}</span>
    </label>
  `).join('');
  document.getElementById('modalFiltrele').classList.add('open');
};

window.temizleFiltre = function() {
  cokluFiltreSet.clear();
  anaFilter = 'hepsi';
  document.getElementById('tabloBaslik').textContent = 'Tüm Aktif Notlar';
  closeModal('modalFiltrele');
  renderStats();
  renderAnaTable();
};

window.uygulaFiltre = function() {
  const checked = document.querySelectorAll('#filtreListesi input:checked');
  cokluFiltreSet = new Set([...checked].map(c => c.value));
  anaFilter = cokluFiltreSet.size ? 'coklu' : 'hepsi';
  document.getElementById('tabloBaslik').textContent = cokluFiltreSet.size
    ? `Filtrelendi (${cokluFiltreSet.size} durum)` : 'Tüm Aktif Notlar';
  closeModal('modalFiltrele');
  renderStats();
  renderAnaTable();
};

function renderAnaTable() {
  let filtered = allNotes;
  if (anaFilter === 'coklu' && cokluFiltreSet.size) {
    filtered = filtered.filter(n => cokluFiltreSet.has(n.durum));
  } else if (anaFilter !== 'hepsi') {
    filtered = filtered.filter(n => n.durum === anaFilter);
  }

  const q = (document.getElementById('notSearch')?.value || '').trim().toLowerCase();
  if (q) {
    filtered = filtered.filter(n =>
      (n.not || '').toLowerCase().includes(q) || (n.dosyaAd || '').toLowerCase().includes(q)
    );
  }

  // Sıralama
  filtered = [...filtered];
  const siralama = document.getElementById('siralamaSec')?.value || 'alfabetik';
  if (siralama === 'alfabetik') {
    filtered.sort((a, b) => (a.dosyaAd||'').localeCompare(b.dosyaAd||'', 'tr'));
  } else {
    filtered.sort((a, b) => {
      const ta = a.tarih?.toDate ? a.tarih.toDate() : new Date(a.tarih||0);
      const tb = b.tarih?.toDate ? b.tarih.toDate() : new Date(b.tarih||0);
      return tb - ta;
    });
  }

  if (filtered.length === 0) {
    document.getElementById('anaTableWrap').innerHTML =
      '<div class="empty"><div class="empty-icon">✅</div><div class="empty-text">Aktif görev yok</div></div>';
    return;
  }

  document.getElementById('anaTableWrap').innerHTML = `
    <table>
      <thead><tr><th>Dosya</th><th>Tarih</th><th>Not / Yapılacak</th><th>Durum</th></tr></thead>
      <tbody>
        ${filtered.map(n => `
          <tr>
            <td class="td-ada" onclick="openDosya('${n.dosyaId}','${esc(n.dosyaAd)}')">${n.dosyaAd}</td>
            <td class="td-tarih">${formatTarih(n.tarih)}</td>
            <td class="td-not">${n.not}</td>
            <td>
              <button class="durum" style="${durumStyle(n.durum)}" onclick="openDurumMenu(event,'${n.dosyaId}','${n.id}')">
                ${n.durum || '—'}
              </button>
            </td>
          </tr>
        `).join('')}
      </tbody>
    </table>`;
}

// ── DOSYA DETAY ──
window.openDosya = function(id, ad) {
  aktifDosya = { id, ad };
  document.getElementById('detayBaslik').textContent = ad;
  document.querySelectorAll('.sidebar-item').forEach(el => {
    el.classList.toggle('active', el.dataset.id === id);
  });
  showViewDetay();
  loadNotlar();
};

function showViewDetay() {
  document.getElementById('viewAna').classList.add('view-hidden');
  document.getElementById('viewDetay').classList.remove('view-hidden');
}

async function loadNotlar() {
  document.getElementById('notListesi').innerHTML = '<div class="loading"><div class="spinner"></div></div>';
  const snap = await getDocs(query(collection(db, 'dosyalar', aktifDosya.id, 'notlar'), orderBy('tarih', 'desc')));
  renderNotlar(snap.docs.map(n => ({ id: n.id, ...n.data() })));
}

function renderNotlar(notlar) {
  if (notlar.length === 0) {
    document.getElementById('notListesi').innerHTML =
      '<div class="empty"><div class="empty-icon">📝</div><div class="empty-text">Henüz not yok</div></div>';
    return;
  }
  const aktif = notlar.filter(n => !isTamamlandi(n.durum));
  const bitti = notlar.filter(n => isTamamlandi(n.durum));
  const sorted = [...aktif, ...bitti];

  document.getElementById('notListesi').innerHTML = sorted.map(n => `
    <div class="not-kart ${isTamamlandi(n.durum) ? 'tamamlandi' : ''}">
      <div class="not-kart-meta">
        <div class="not-tarih-badge">${formatTarih(n.tarih)}</div>
        <button class="durum" style="${durumStyle(n.durum)};margin-top:4px" onclick="openDurumMenu(event,'${aktifDosya.id}','${n.id}')">
          ${n.durum || '—'}
        </button>
      </div>
      <div class="not-icerik">${n.not}</div>
      <div class="not-actions">
        <button class="btn btn-ghost btn-sm" onclick="editNot('${n.id}','${esc(n.not)}','${esc(n.durum)}')">✏️</button>
        <button class="btn btn-danger btn-sm" onclick="deleteNot('${n.id}')">🗑</button>
      </div>
    </div>
  `).join('');
}

// ── NOT EKLE / DÜZENLE ──
window.openNotModal = function() {
  editNotId = null;
  document.getElementById('modalNotBaslik').textContent = 'NOT EKLE';
  document.getElementById('inputNot').value = '';
  document.getElementById('inputDurum').value = durumlar[0]?.ad || '';
  document.getElementById('modalNot').classList.add('open');
  setTimeout(() => document.getElementById('inputNot').focus(), 100);
};

window.editNot = function(id, not, durum) {
  editNotId = id;
  document.getElementById('modalNotBaslik').textContent = 'NOT DÜZENLE';
  document.getElementById('inputNot').value = not;
  document.getElementById('inputDurum').value = durum;
  document.getElementById('modalNot').classList.add('open');
};

window.saveNot = async function() {
  const not = document.getElementById('inputNot').value.trim();
  const durum = document.getElementById('inputDurum').value;
  if (!not) { toast('Not boş olamaz!'); return; }
  if (durum === '__yeni__') { toast('Geçerli bir durum seç'); return; }

  if (editNotId) {
    await updateDoc(doc(db, 'dosyalar', aktifDosya.id, 'notlar', editNotId), { not, durum });
    toast('Not güncellendi ✓');
  } else {
    await addDoc(collection(db, 'dosyalar', aktifDosya.id, 'notlar'), { not, durum, tarih: new Date() });
    toast('Not eklendi ✓');
  }
  closeModal('modalNot');
  loadNotlar();
  updateBadges();
};

window.deleteNot = async function(id) {
  if (!confirm('Bu notu silmek istediğinize emin misiniz?')) return;
  await deleteDoc(doc(db, 'dosyalar', aktifDosya.id, 'notlar', id));
  toast('Not silindi');
  loadNotlar();
  updateBadges();
};

// ── DOSYA ADI DEĞİŞTİR ──
window.renameDosya = async function(yeniAd) {
  yeniAd = yeniAd.trim().toUpperCase();
  if (!yeniAd || !aktifDosya || yeniAd === aktifDosya.ad) {
    if (aktifDosya) document.getElementById('detayBaslik').textContent = aktifDosya.ad;
    return;
  }
  if (dosyalar.find(d => d.ad === yeniAd && d.id !== aktifDosya.id)) {
    toast('Bu isimde bir dosya zaten var!');
    document.getElementById('detayBaslik').textContent = aktifDosya.ad;
    return;
  }
  await updateDoc(doc(db, 'dosyalar', aktifDosya.id), { ad: yeniAd });
  aktifDosya.ad = yeniAd;
  document.getElementById('detayBaslik').textContent = yeniAd;
  toast('Dosya adı güncellendi ✓');
  await loadDosyalar();
};

// ── YENİ DOSYA ──
window.openYeniAdaModal = function() {
  document.getElementById('inputAdaAdi').value = '';
  document.getElementById('modalYeniAda').classList.add('open');
  setTimeout(() => document.getElementById('inputAdaAdi').focus(), 100);
};

window.createDosya = async function() {
  const ad = document.getElementById('inputAdaAdi').value.trim().toUpperCase();
  if (!ad) { toast('Ad boş olamaz!'); return; }
  if (dosyalar.find(d => d.ad === ad)) { toast('Bu dosya zaten var!'); return; }
  const ref = await addDoc(collection(db, 'dosyalar'), { ad, olusturma: new Date() });
  closeModal('modalYeniAda');
  await loadDosyalar();
  toast('Dosya oluşturuldu ✓');
  openDosya(ref.id, ad);
};

window.deleteDosya = async function() {
  if (!aktifDosya) return;
  if (!confirm(`"${aktifDosya.ad}" dosyasını ve tüm notlarını silmek istediğinize emin misiniz?`)) return;
  const snap = await getDocs(collection(db, 'dosyalar', aktifDosya.id, 'notlar'));
  for (const n of snap.docs) await deleteDoc(n.ref);
  await deleteDoc(doc(db, 'dosyalar', aktifDosya.id));
  toast('Dosya silindi');
  await loadDosyalar();
  showView('ana');
};

// ── MODAL ──
window.closeModal = function(id) { document.getElementById(id).classList.remove('open'); };
document.querySelectorAll('.modal-bg').forEach(m =>
  m.addEventListener('click', e => { if (e.target === m) m.classList.remove('open'); })
);

document.getElementById('inputAdaAdi').addEventListener('keydown', e => { if (e.key === 'Enter') window.createDosya(); });
document.getElementById('inputDurumAdi').addEventListener('keydown', e => { if (e.key === 'Enter') window.saveDurum(); });

// ── BAŞLAT ──
async function init() {
  await loadDurumlar();
  await loadDosyalar();
  await loadAll();
}

init();
</script>
</body>
</html>
